services:
  - type: web
    name: agri-tech
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - {key: NODE_VERSION, value: 20}
      - {key: MONGO_URI, sync: false}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ADMIN_EMAIL, value: admin@agritech.com}
      - {key: ADMIN_PASSWORD, sync: false}
